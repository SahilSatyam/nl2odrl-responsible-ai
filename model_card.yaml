# model_card.yaml — human-owned narrative for the NL→ODRL assistant.
# Comment out `limitations` to simulate the CI gate failing.

model_name: "Natural Language to ODRL Policy Assistant"
model_id: "nl2odrl-v1"
owner_team: "Policy Language Team — Responsible AI"
risk_tier: high
last_reviewed: 2026-09-01
recertification_due: 2027-03-01

pipeline:
  - natural_language
  - odrl
  - cedar
  - opa_rego

intended_use: >
  Draft W3C ODRL 2.2 policies from natural-language access rules, then
  propose Cedar and OPA/Rego encodings of that ODRL for a human policy
  author. Output is a suggestion. It becomes enforceable only after
  named sign-off and explicit attach to a policy enforcement point.
  Evaluation (this repo) measures gold NL ↔ gold ODRL ↔ frozen Cedar/Rego
  pairs. This repo does not run the converter.

intended_users:
  - "Policy authors drafting dataset, document, or API usage rules"
  - "Authorization engineers reviewing Cedar / Rego diffs"
  - "Responsible AI reviewers checking over-permission on a gold set"

out_of_scope:
  - "Live authorization of production requests (that is the PEP, not this model)"
  - "Translating statutes, contracts, or court opinions into code"
  - "Credit, lending, insurance, employment, or housing decisions"
  - "Inventing permissions that are not in the source sentence"
  - "Multi-jurisdiction legal interpretation"

prohibited_uses:
  - "Auto-attaching generated Cedar or Rego to a PEP / OPA cluster"
  - "Treating model output as legal advice or as a substitute for counsel"
  - "Widening access because the NL was ambiguous (must fail closed)"
  - "Using the assistant to weaken an existing deny/prohibition"

limitations: >
  Natural language is underspecified. The assistant must not guess missing
  actors, assets, actions, or constraints into an allow. Temporal, spatial,
  and duty/obligation clauses are a known weak slice. Ambiguous prompts are
  out of the automated-suggest path and must fail closed. ODRL is the
  semantic source of truth; Cedar and Rego are encodings and must not add
  permits. English gold set only. Not validated as a legal-reasoning system.

ethical_considerations: >
  Silently granting more rights than the speaker stated is the harm this
  system can cause. We therefore gate on over-permission rate, ODRL
  constraint preservation, and encoding agreement (ODRL→Cedar, ODRL→Rego),
  not on BLEU-like fluency. Protected-attribute fairness is not the primary
  lens here; privilege expansion is. Authors retain override. Generated
  policy is not law.

decision_rights:
  automation_level: human_in_the_loop
  sole_determinant: false
  human_override: true
  attach_to_pep_requires_signoff: true
  fail_closed_on_ambiguity: true
  review:
    channel: "policy-authors@example.org"
    sla_days: 5
    required_before_enforce: true

contact:
  owner_email: "policy-language@example.org"
  model_risk_email: "model-risk@example.org"
  ethics_escalation: "responsible-ai@example.org"

regulatory_basis:
  eu_ai_act_role: >
    Documented as a high-influence authoring tool with mandatory human
    oversight (Art. 14 analogue). It is not placed in production as an
    autonomous decision system. Transparency (Art. 13) is this model card
    plus the compliance bundle.
  nist_ai_rmf_functions:
    - GOVERN
    - MAP
    - MEASURE
    - MANAGE
  odrl_profile: "W3C ODRL 2.2 core (permission, prohibition, obligation, constraint)"
  authorization_targets:
    - cedar
    - opa_rego

known_failure_modes:
  - slice: ambiguous_nl
    handling: exclude_from_automated_path
    description: >
      Vague actor/asset/action language must not emit a permit. Route to
      the author with a clarification prompt; default deny.

evaluation_data_summary: >
  Frozen gold set of NL sentences with independently authored ODRL JSON-LD
  and reviewed Cedar/Rego encodings. Metrics are produced by an eval
  harness that lives outside this dummy repo. CI only consumes the numbers.

caveats_and_recommendations: >
  Recertify if the ODRL profile, Cedar schema, or Rego helpers change —
  encoding drift is a silent allow. Do not read a passing over-permission
  rate as "safe to auto-deploy."
