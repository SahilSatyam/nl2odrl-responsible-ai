# policies/governance.yaml
# Thresholds for the NL→ODRL assistant. The eval harness does not get to
# declare that it passed.

schema_version: 1
policy_id: "nl2odrl-rai-v1"
owner: "Responsible AI / Policy Engineering"
frameworks:
  - "NIST AI RMF 1.0 (GOVERN / MAP / MEASURE / MANAGE)"
  - "EU AI Act — transparency, human oversight, accuracy (not a legal-advice system)"
  - "W3C ODRL 2.2 Information Model"
  - "OECD AI Principles (robustness, accountability)"
  - "Mitchell et al. 2019 Model Cards"

required_static_fields:
  - model_name
  - model_id
  - owner_team
  - pipeline
  - intended_use
  - intended_users
  - limitations
  - ethical_considerations
  - out_of_scope
  - prohibited_uses
  - decision_rights
  - recertification_due
  - last_reviewed
  - risk_tier
  - regulatory_basis
  - contact

required_pipeline_stages:
  - natural_language
  - odrl
  - cedar
  - opa_rego

identity:
  require_model_id_match: true
  require_artifact_hashes:
    - gold_set_hash
    - model_artifact_hash
    - eval_harness_git_sha

lifecycle:
  max_days_since_review: 180
  recertification_must_be_future: true

decision_rights:
  high_risk_max_automation: "human_in_the_loop"
  forbid_sole_automated_decision: true
  require_human_override: true
  require_pep_signoff: true
  require_fail_closed_on_ambiguity: true

fidelity:
  min_gold_n: 100
  min_semantic_match: 0.90
  min_constraint_preservation: 0.95
  # Red line: generated policy allows something the NL did not.
  max_over_permission_rate: 0.02
  max_under_permission_rate: 0.10
  min_cedar_agree: 0.95
  min_rego_agree: 0.95
  required_constructs:
    - permission
    - prohibition
    - obligation
    - constraint
  min_construct_n: 20

slices:
  require_known_failure_modes_for_out_of_prod_slices: true
  max_over_permission_if_in_production: 0.02
  min_semantic_match_if_in_production: 0.85

strict_warnings_fail_ci: false
