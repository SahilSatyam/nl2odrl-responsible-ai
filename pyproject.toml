[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2odrl"
version = "2.0.0"
description = "NL-to-ODRL agentic converter: natural-language access rules to W3C ODRL 2.2, built on agentcrash-core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agentcrash-core>=0.2.0",
  "pyyaml>=6.0",
  "jsonschema",
  "pyshacl",
  "dspy",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
odrl-host = "odrl_agent.cli:main"

[tool.setuptools.packages.find]
include = ["odrl_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
