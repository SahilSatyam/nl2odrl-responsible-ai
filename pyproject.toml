[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-card"
version = "2.0.0"
description = "Responsible AI gate: model card and compliance bundle for NL→ODRL→Cedar/Rego assistants."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7",
  "eval_type_backport>=0.2",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
converter = [
  "agentcrash-core>=0.2.0",
  "pyshacl",
  "dspy",
  "numpy>=1.26",
  "jsonschema",
]

[project.scripts]
rai-card = "rai_card.cli:main"
odrl-host = "odrl_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rai_card*", "odrl_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
