name: rai-gate

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest
      - name: Generate model card (must pass)
        run: python generate_card.py
      - name: Broken-card fixture must fail
        run: |
          python generate_card.py \
            --static model_card_BROKEN_demo.yaml \
            --report /tmp/broken.json \
            --output /tmp/should-not-write.md \
            && echo "expected non-zero" && exit 1 \
            || test $? -eq 1

  converter:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (converter on agentcrash-core)
        run: pip install ".[converter]" pytest
      - name: Converter tests
        run: pytest tests/test_check.py tests/test_serve.py tests/test_scan_pii.py tests/test_policy.py tests/test_schemas.py tests/test_verifiers.py tests/test_diagnose.py tests/test_replay.py tests/test_run.py tests/test_seed.py tests/test_adapter_live.py tests/test_dspy_opt.py tests/test_inline_nl.py tests/test_model_usage.py tests/test_odrl_shacl.py tests/test_scenarios_odrl.py tests/test_web.py tests/test_web_http.py tests/test_agent_opts.py -q
      - name: PII guardrail (scan-pii over PASS golden trace + state)
        run: >
          agentcrash check
          --trace tests/fixtures/traces/odrl_convert_timeout-fixed-seed42.jsonl
          --state tests/fixtures/traces/odrl_convert_timeout-fixed-seed42.state.json
          --plugin odrl_agent.verifiers
          --invariant odrl_valid --invariant no_attacker_grant --invariant exactly_once_save
          --report-out /tmp/scan-pii.verdict.json --scan-pii
